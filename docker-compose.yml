name: proto-folio

services:
  app:
    build:
      context: .
      target: runtime
    image: proto-folio:latest
    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME:-Proto Folio}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:?APP_KEY is required. Copy .env.docker.example to .env.docker and set it.}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}

      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-profolio}
      DB_USERNAME: ${DB_USERNAME:-profolio}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Proto Folio}

      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_DEFAULTS: ${SEED_DEFAULTS:-true}
      APP_OPTIMIZE: ${APP_OPTIMIZE:-true}

    volumes:
      - storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy

  web:
    image: proto-folio:latest
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]

    ports:
      - "${APP_PORT:-8080}:80"

    volumes:
      - storage:/var/www/html/storage:ro

    depends_on:
      - app

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-profolio}
      POSTGRES_USER: ${DB_USERNAME:-profolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}

    volumes:
      - dbdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-profolio} -d ${DB_DATABASE:-profolio}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  dbdata:
