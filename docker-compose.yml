name: proto-folio

# Shared by every PHP container so the web app and the queue worker always see
# the same database, cache and catalog settings.
x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Proto Folio}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_KEY: ${APP_KEY:?APP_KEY is required. Copy .env.docker.example to .env.docker and set it.}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}

  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}

  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-profolio}
  DB_USERNAME: ${DB_USERNAME:-profolio}
  DB_PASSWORD: ${DB_PASSWORD:-secret}

  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Proto Folio}

  CATALOG_REBUILD_URL: ${CATALOG_REBUILD_URL:-}
  CATALOG_REBUILD_TOKEN: ${CATALOG_REBUILD_TOKEN:-}
  CATALOG_REBUILD_DELAY_MINUTES: ${CATALOG_REBUILD_DELAY_MINUTES:-2}

  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  SEED_DEFAULTS: ${SEED_DEFAULTS:-false}
  APP_OPTIMIZE: ${APP_OPTIMIZE:-true}

services:
  app:
    build:
      context: .
      target: runtime
    image: proto-folio:latest
    restart: unless-stopped

    environment: *app-environment

    volumes:
      - storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy

  worker:
    image: proto-folio:latest
    restart: unless-stopped

    # Let an in-flight job finish before Docker sends SIGKILL.
    stop_grace_period: 45s

    # Runs as www-data so the shared storage volume keeps consistent ownership.
    # The entrypoint only runs migrations/setup when the first argument is
    # php-fpm, so this container just starts the queue loop.
    command: ["su-exec", "www-data", "php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=30", "--max-time=3600"]

    environment: *app-environment

    volumes:
      - storage:/var/www/html/storage

    # The web healthcheck only passes once the app container has finished its
    # entrypoint, so the queue never starts before the jobs table exists.
    depends_on:
      web:
        condition: service_healthy

  web:
    image: proto-folio:latest
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]

    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:80"

    volumes:
      - storage:/var/www/html/storage:ro

    depends_on:
      - app

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-profolio}
      POSTGRES_USER: ${DB_USERNAME:-profolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}

    volumes:
      - dbdata:/var/lib/postgresql/data

    # Loopback only, for GUI clients (DBeaver/TablePlus) reached over an SSH tunnel.
    # From your machine: SSH host = the VPS, database host = 127.0.0.1, port = DB_HOST_PORT.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-profolio} -d ${DB_DATABASE:-profolio}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  dbdata:
