server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Docker's embedded DNS. Resolving at request time (instead of once at startup)
    # keeps nginx booting even when the php-fpm container is recreated or still starting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;

        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|svg|png|jpe?g|gif|ico|webp)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
